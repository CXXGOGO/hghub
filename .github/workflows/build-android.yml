name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '选择构建的目标架构 (主流手机选 aarch64 即可，速度快)'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - all (aarch64, armv7, x86_64)
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK (${{ inputs.arch || 'aarch64' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "Build tools & NDK ready."

      - name: Setup Rust Toolchain & Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-apk

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android Project
        run: pnpm tauri android init --ci

      - name: Compile APK
        run: |
          ARCH="${{ inputs.arch }}"
          if [ "$ARCH" = "all (aarch64, armv7, x86_64)" ]; then
            echo "Building for all architectures..."
            pnpm tauri android build --apk --split-per-abi --target aarch64 armv7 x86_64
          else
            echo "Building for ARM64 (aarch64) - Standard Android phone..."
            pnpm tauri android build --apk --target aarch64
          fi

      - name: Sign APK (Smart Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          KS="$RUNNER_TEMP/release.keystore"
          mkdir -p artifacts

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Using custom Keystore from Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            STORE_PASS="$STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
            ALIAS="$KEY_ALIAS"
          else
            echo "No custom Secrets found. Generating dedicated self-signed Keystore..."
            STORE_PASS="pockettheaterpass"
            KEY_PASS="pockettheaterpass"
            ALIAS="pockettheater"
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PocketTheater, OU=Media, O=AppStudio, L=City, ST=State, C=US"
          fi

          echo "Signing generated APKs..."
          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            name="$(basename "$f")"
            out="artifacts/PocketTheater-${name}"
            echo "Signing $f -> $out"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3 || true
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何生成的 APK 文件"; exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PocketTheater-Android-APK
          path: artifacts/*.apk
          retention-days: 14
