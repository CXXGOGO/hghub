name: Build (Windows & Android)

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择构建平台'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - android
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/build.yml'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================= Windows x64：NSIS 安装包 + 便携绿色包 =================
  windows:
    name: Windows x64 (Installer + Portable)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 获取版本号
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-build

      - run: pnpm install --frozen-lockfile

      - name: 构建（NSIS 安装包）
        run: pnpm tauri build --bundles nsis

      - name: 收集产物（安装包 + 便携绿色包）
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # 复制 NSIS 安装包
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          # 查找生成的执行文件制作便携包
          $bin = (Get-ChildItem "src-tauri/target/release" -Filter *.exe | Where-Object { $_.Name -notlike "*setup*" -and $_.Name -notlike "*uninstall*" } | Select-Object -First 1).FullName
          if ($bin) {
            Copy-Item $bin "artifacts/PocketTheater.exe"
            Compress-Archive -Path "artifacts/PocketTheater.exe" -DestinationPath "artifacts/PocketTheater_${v}_x64_portable.zip" -Force
            Remove-Item "artifacts/PocketTheater.exe"
          }
          Get-ChildItem artifacts | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PocketTheater-Windows-x64
          path: artifacts/*
          retention-days: 14

  # ================= Android：APK 自动签名 + 防拦截 =================
  android:
    name: Android APK (ARM64)
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Setup Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-build

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Android 工程
        run: pnpm tauri android init --ci

      - name: 编译 Android APK (aarch64)
        run: pnpm tauri android build --apk --target aarch64

      - name: 签名 APK (自签名防拦截)
        run: |
          set -euo pipefail
          BT="$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -1)"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BT/apksigner"
          KS="$RUNNER_TEMP/release.keystore"
          mkdir -p artifacts

          STORE_PASS="pockettheaterpass"
          KEY_PASS="pockettheaterpass"
          ALIAS="pockettheater"
          keytool -genkeypair -v \
            -keystore "$KS" \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=PocketTheater, OU=Media, O=AppStudio, L=City, ST=State, C=US"

          found=0
          for f in $(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk'); do
            name="$(basename "$f")"
            out="artifacts/PocketTheater-${name}"
            echo "Signing $f -> $out"
            "$APKSIGNER" sign \
              --ks "$KS" --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" --key-pass "pass:$KEY_PASS" \
              --v4-signing-enabled false \
              --out "$out" "$f"
            "$APKSIGNER" verify --print-certs "$out" | head -3 || true
            found=$((found+1))
          done
          rm -f "$KS"
          if [ "$found" -eq 0 ]; then
            echo "::error::没有找到任何生成的 APK 文件"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: PocketTheater-Android-APK
          path: artifacts/*.apk
          retention-days: 14
